<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf5e6"/>
      <stop offset="1" stop-color="#eedfbb"/>
    </linearGradient>
    <!-- Луч короны: яркий у диска, к концу растворяется -->
    <linearGradient id="ray" gradientUnits="userSpaceOnUse" x1="512" y1="512" x2="512" y2="150">
      <stop offset="0.45" stop-color="#f0a53a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#f0a53a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="512" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#f6c45f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f6c45f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun" cx="470" cy="560" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a8"/>
      <stop offset="1" stop-color="#f29b1f"/>
    </radialGradient>
    <path id="r" d="M512 512 L499 250 Q512 105 525 250 Z" fill="url(#ray)"/>
    <!-- Размытие делает лучи похожими на тонкие струи короны, а не на лепестки -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
    <!-- Лучи разной длины, как у короны во время затмения -->
    <g filter="url(#soft)" opacity=".8">
    <use href="#r" transform="rotate(-8 512 512) translate(512 512) scale(1 1.0) translate(-512 -512)"/>
    <use href="#r" transform="rotate(22 512 512) translate(512 512) scale(1 0.72) translate(-512 -512)"/>
    <use href="#r" transform="rotate(50 512 512) translate(512 512) scale(1 0.92) translate(-512 -512)"/>
    <use href="#r" transform="rotate(82 512 512) translate(512 512) scale(1 1.12) translate(-512 -512)"/>
    <use href="#r" transform="rotate(108 512 512) translate(512 512) scale(1 0.7) translate(-512 -512)"/>
    <use href="#r" transform="rotate(136 512 512) translate(512 512) scale(1 0.85) translate(-512 -512)"/>
    <use href="#r" transform="rotate(170 512 512) translate(512 512) scale(1 0.98) translate(-512 -512)"/>
    <use href="#r" transform="rotate(198 512 512) translate(512 512) scale(1 0.75) translate(-512 -512)"/>
    <use href="#r" transform="rotate(222 512 512) translate(512 512) scale(1 1.18) translate(-512 -512)"/>
    <use href="#r" transform="rotate(250 512 512) translate(512 512) scale(1 0.8) translate(-512 -512)"/>
    <use href="#r" transform="rotate(280 512 512) translate(512 512) scale(1 0.95) translate(-512 -512)"/>
    <use href="#r" transform="rotate(308 512 512) translate(512 512) scale(1 1.05) translate(-512 -512)"/>
    <use href="#r" transform="rotate(336 512 512) translate(512 512) scale(1 0.78) translate(-512 -512)"/>
    </g>
    <!-- Солнце и луна, сдвинутая так, что остаётся светящийся серп -->
    <circle cx="512" cy="512" r="205" fill="url(#sun)"/>
    <circle cx="556" cy="476" r="198" fill="#1d2633"/>
  </g>
</svg>
